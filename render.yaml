services:
  - type: web
    name: quickmind-api
    runtime: python-3.11
    workingDirectory: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: http://localhost:5173
