services:
  # 1. Backend FastAPI Service
  - type: web
    name: quickmind-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true # Render will auto-generate a secure key for you!

  # 2. Frontend Streamlit Service
  - type: web
    name: quickmind-frontend
    env: python
    buildCommand: "cd frontend && pip install -r requirements.txt"
    startCommand: "cd frontend && streamlit run app.py --server.port $PORT --server.address 0.0.0.0"
    envVars:
      - key: BACKEND_URL
        # This automatically grabs the backend URL and gives it to the frontend!
        fromService:
          type: web
          name: quickmind-backend
          envVarKey: RENDER_EXTERNAL_URL
